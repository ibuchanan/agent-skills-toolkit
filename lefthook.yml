colors: false
output:
  - meta
  - summary
  - failure

lint:
  parallel: true
  commands:
    biome:
      run: npm run lint:biome
    markdown:
      run: npm run lint:markdown
    spell:
      run: npm run lint:spell
    typecheck:
      run: npm run typecheck

pre-commit:
  parallel: true
  commands:
    build:
      run: npm run build
    format:
      run: npm run format
      stage_fixed: true
    gitleaks:
      run: |
        command -v gitleaks >/dev/null 2>&1 || {
          echo "gitleaks not found on PATH. Install it with: brew install gitleaks" >&2
          exit 1
        }
        gitleaks git --pre-commit --staged

pre-push:
  commands:
    format:
      run: npm run format:check
    lint:
      run: npm run lint
    test:
      run: npm run test
