colors: false
output:
  - meta
  - summary
  - failure

lint:
  parallel: true
  commands:
    biome:
      run: bun run lint:biome
    markdown:
      run: bun run lint:markdown
    spell:
      run: bun run lint:spell
    typecheck:
      run: bun run typecheck

pre-commit:
  parallel: true
  commands:
    build:
      run: bun run build
    format:
      run: bun run format
      stage_fixed: true
    gitleaks:
      run: |
        command -v gitleaks >/dev/null 2>&1 || {
          echo "gitleaks not found on PATH. Install it with: brew install gitleaks" >&2
          exit 1
        }
        gitleaks git --pre-commit --staged

pre-push:
  commands:
    format:
      run: bun run format:check
    lint:
      run: bun run lint
    test:
      run: bun run test
