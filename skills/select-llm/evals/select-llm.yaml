- description: "select-llm avoids frontier overkill for cheap utility workflows"
  vars:
    skill_path: src/skills/select-llm/SKILL.md
    task: |
      Pick a default model for routine title normalization, short translation, and
      light summarization jobs in a batch pipeline. Failure is cheap, latency and
      token cost matter, and escalation is available.
    required_paths:
      summary: true
      recommended_actions: true
      guardrails: true
      references: true
    expect_substrings:
      recommended_actions:
        - escalation
    expect_any_substrings:
      recommended_actions:
        - [lowest-cost, low-cost, cheapest]
      "*":
        - latency
        - cost
    reject_substrings:
