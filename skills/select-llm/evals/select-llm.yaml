- description: "select-llm balances cost, quality, and fallback choices"
  vars:
    skill_path: src/skills/select-llm/SKILL.md
    task: |
      Choose a model strategy for extracting invoice fields into strict JSON under
      budget and latency constraints, with retries and a fallback path.
    required_paths:
      summary: true
      recommended_actions: true
      guardrails: true
      references: true
    expect_substrings:
      recommended_actions:
        - primary
        - fallback
        - json
    expect_any_substrings:
      "*":
        - latency
        - budget
    array_min_lengths:
      recommended_actions: 3
      guardrails: 2
      references: 2

