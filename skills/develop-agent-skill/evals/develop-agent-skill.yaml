- description: "develop-agent-skill recommends an inspect-evaluate-iterate loop"
  vars:
    skill_path: src/skills/develop-agent-skill/SKILL.md
    task: |
      A skill directory already exists but its instructions feel generic and weak.
      Explain how to improve it through a structured revision loop.
    required_paths:
      summary: true
      recommended_actions: true
      guardrails: true
      references: true
    expect_substrings:
      recommended_actions:
        - inspect
        - promptlint
        - revise
    expect_any_substrings:
      "*":
        - - evidence
          - diagnose
          - compare
          - actual output
        - - rewrite
          - revise
          - edit
          - change
    array_min_lengths:
      recommended_actions: 3
      guardrails: 2
      references: 1

- description: "develop-agent-skill loosens a brittle substring assertion instead of rewriting the skill"
  vars:
    skill_path: src/skills/develop-agent-skill/SKILL.md
    task: |
      A skill's promptfoo eval failed with: "recommended_actions is missing
      expected substring: duplication". I checked the model's actual output and
      it says "Eliminate duplicated setup by extracting shared fixtures" — the
      concept is there, just a different word form (duplicated vs duplication).
      What should I actually change?
    required_paths:
      summary: true
      recommended_actions: true
      guardrails: true
      references: true
    expect_any_substrings:
      "*":
        - - expect_any_substrings
          - synonym
          - alternative wording
          - alternative phrasing
          - regex
          - flexible
          - exact substring
          - brittle assertion
          - too strict
          - different word form
        - - do not rewrite
          - skill is correct
          - not a skill
          - leave the skill
          - skill's output is correct
          - concept is correctly conveyed
          - do not revise the skill
          - not a skill gap
          - assertion is too strict
          - fix the assertion
    array_min_lengths:
      recommended_actions: 2
      guardrails: 1
      references: 1

- description: "develop-agent-skill removes an over-eager reject_substrings rule"
  vars:
    skill_path: src/skills/develop-agent-skill/SKILL.md
    task: |
      A skill teaches migrating from an old CLI command to a new one. Its eval
      task hands the model the old command literally and asks how to run it
      instead, but the eval's reject_substrings bans that literal old command
      in recommended_actions. The model's correct answer has to name the old
      command for contrast ("replace `node -e` with `bun -e`"), so it fails the
      eval. What is actually wrong here, and what should change?
    required_paths:
      summary: true
      recommended_actions: true
      guardrails: true
      references: true
    expect_any_substrings:
      "*":
        - - reject_substrings
        - - remove
          - drop
          - loosen
          - delete
          - revise
          - narrow
          - more specific
        - - eval bug
          - test-authoring bug
          - assertion is wrong
          - not a skill bug
          - brittle assertion
          - assertion is too strict
          - assertion or test-authoring bug
    array_min_lengths:
      recommended_actions: 2
      guardrails: 1
      references: 1

- description: "develop-agent-skill distinguishes a brittle assertion from a genuine content gap"
  vars:
    skill_path: src/skills/develop-agent-skill/SKILL.md
    task: |
      Two eval tests for the same skill both fail. Test A: the assertion wants
      "workflows" but the model wrote "workflow" — a plural/singular mismatch,
      and the underlying concept is otherwise present in the response. Test B:
      the assertion wants "NEEDS WORK" but the model's answer never uses that
      label, or any equivalent status marker, anywhere. How should I handle A
      and B differently?
    required_paths:
      summary: true
      recommended_actions: true
      guardrails: true
      references: true
    expect_any_substrings:
      "*":
        - - loosen
          - synonym
          - expect_any_substrings
          - word form
          - relax
          - flexible match
          - brittle assertion
          - plural/singular
        - - gap
          - missing
          - the skill
          - never mentions
          - revise the skill
          - skill gap
          - genuinely missing
    array_min_lengths:
      recommended_actions: 3
      guardrails: 1
      references: 1

- description: "develop-agent-skill requires content assertions beyond structural checks"
  vars:
    skill_path: src/skills/develop-agent-skill/SKILL.md
    task: |
      A newly scaffolded skill's eval only checks required_paths (fields are
      present) and array_min_lengths (arrays are long enough). There are no
      expect_substrings or expect_any_substrings checks at all. Is this eval
      coverage sufficient before I call the skill ready for use?
    required_paths:
      summary: true
      recommended_actions: true
      guardrails: true
      references: true
    expect_any_substrings:
      "*":
        - - not sufficient
          - insufficient
          - not enough
          - add
        - - wrong answer
          - malformed
          - shape
          - differentiating vocabulary
          - expected instructions
          - triggers
          - defaults
          - correct
          - actionable
    array_min_lengths:
      recommended_actions: 2
      guardrails: 1
      references: 1
