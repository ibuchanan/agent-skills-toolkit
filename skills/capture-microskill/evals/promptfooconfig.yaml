$schema: https://promptfoo.dev/config-schema.json

description: capture-microskill approved capture-workflow scenarios (not downstream tool validation).

# Run prepare.mjs before each fresh, single-pass run. Do not repeat in place.
evaluateOptions:
  maxConcurrency: 1

providers:
  - id: anthropic:claude-agent-sdk
    label: capture-cspell
    config:
      model: claude-sonnet-4-6
      working_dir: ./.work/cspell
      setting_sources: [project]
      skills: [capture-microskill]
      tools:
        type: preset
        preset: claude_code
      custom_allowed_tools: [Read, Glob, Grep, Write, Edit]
      permission_mode: default
      persist_session: false
      max_turns: 20
