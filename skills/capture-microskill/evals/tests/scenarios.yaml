- description: "cspell: One cspell package faithfully retains both supplied options, with no provenance or execution claims."
  providers: [capture-cspell]
  vars:
    case_id: cspell
    request: "Capture these selected cspell lessons from two session logs into skills/cspell/SKILL.md. Log A: use `cspell --config spelling.json notes.md` to select the configuration explicitly. Log B: use `cspell --no-progress notes.md` to suppress progress output. Keep these related lessons together."
  assert:
    - type: skill-used
      value: capture-microskill
    - type: llm-rubric
      value: "One cspell package faithfully retains both supplied options, with no provenance or execution claims. Judge the final response only; filesystem and attempted tool-use checks are separate. Do not require exact wording or a claim that the target tool was run."
      threshold: 0.8
      provider:
        id: anthropic:messages:claude-sonnet-4-6
        config:
          temperature: 0
